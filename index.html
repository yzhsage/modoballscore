<div id="fallback-error" style="display:none;padding:16px;margin:16px;border-radius:12px;background:#FBEBEA;color:#9C2E27;font-family:-apple-system,sans-serif;font-size:13px;white-space:pre-wrap;word-break:break-all;"></div>
<script>
  function showFallbackError(msg) {
    var el = document.getElementById('fallback-error');
    if (el) { el.style.display = 'block'; el.innerText = '⚠️ 發生錯誤：\n' + msg; }
  }
  window.addEventListener('error', function (e) {
    showFallbackError((e.message || '未知錯誤') + '\n位置: ' + (e.filename || '') + ':' + (e.lineno || '') + ':' + (e.colno || ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showFallbackError('Promise 錯誤: ' + (e.reason && e.reason.message ? e.reason.message : JSON.stringify(e.reason)));
  });
</script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

/* ---------------------------------------------------------
   雲端資料庫 (Firebase Realtime Database，免費方案)
--------------------------------------------------------- */
const FIREBASE_URL = 'https://modoballscore-default-rtdb.asia-southeast1.firebasedatabase.app';

async function dbGet(key, fallback) {
  try {
    const res = await fetch(`${FIREBASE_URL}/${key}.json`);
    if (!res.ok) throw new Error('fetch failed');
    const val = await res.json();
    return val === null || val === undefined ? fallback : val;
  } catch (e) {
    console.error('dbGet error', key, e);
    return { __error: true, fallback };
  }
}
async function dbSet(key, value) {
  try {
    const res = await fetch(`${FIREBASE_URL}/${key}.json`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(value),
    });
    if (!res.ok) throw new Error('write failed');
    return true;
  } catch (e) {
    console.error('dbSet error', key, e);
    return false;
  }
}

/* ---------------------------------------------------------
   待辦事項 (下個版本規劃)
   1. 項目管理：讓爸媽可以在 App 內自行「新增／刪除」計分項目（不含改名）
   2. 整週補登頁面加入視覺辨識功能：拍白板照片自動辨識帶入分數
--------------------------------------------------------- */

/* ---------------------------------------------------------
   常數設定
--------------------------------------------------------- */
const CHILDREN = [
  { id: 'duoduo', name: '多多', color: '#2F5FDB', soft: '#EAF0FE', dark: '#1F3F99', emoji: '🐷' },
  { id: 'qiuqiu', name: '球球', color: '#D3453B', soft: '#FBEBEA', dark: '#9C2E27', emoji: '🐮' },
];

const COMMON_ITEMS = ['起床', '中晝頓', '歇晝', '收𨑨迌物仔', '暗頓', '洗身軀', '歇睏'];
const SCHOOL_ITEMS = ['學校表現', '宿題', '收冊包'];
const HOLIDAY_ITEMS = ['算術', '語言', '行為'];
const SPECIAL_ITEMS = [...SCHOOL_ITEMS, ...HOLIDAY_ITEMS];
const ALL_ITEMS_ORDER = [...COMMON_ITEMS, ...SPECIAL_ITEMS];

const GRADES = [
  { g: 'A', pt: 3 },
  { g: 'B', pt: 1 },
  { g: 'C', pt: 0 },
  { g: 'D', pt: -1 },
  { g: 'E', pt: -2 },
];
const GRADE_POINTS = GRADES.reduce((m, g) => ({ ...m, [g.g]: g.pt }), {});

const WEEKDAY_LABELS = ['一', '二', '三', '四', '五', '六', '日'];
const STORAGE_KEYS = { duoduo: 'records-duoduo', qiuqiu: 'records-qiuqiu' };

/* ---------------------------------------------------------
   日期工具
--------------------------------------------------------- */
const pad = (n) => String(n).padStart(2, '0');
const toDateStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDateStr = (s) => new Date(s + 'T00:00:00');
const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
const getMonday = (d) => { const day = d.getDay(); const diff = day === 0 ? -6 : 1 - day; return addDays(d, diff); };
const weekdayIdx = (d) => (d.getDay() + 6) % 7;

function getDayType(dateStr, overrides) {
  if (overrides[dateStr]) return overrides[dateStr];
  const idx = weekdayIdx(parseDateStr(dateStr));
  return idx >= 5 ? 'holiday' : 'school';
}
function itemsForDayType(type) {
  return type === 'school' ? [...COMMON_ITEMS, ...SCHOOL_ITEMS] : [...COMMON_ITEMS, ...HOLIDAY_ITEMS];
}
function getWeekDateStrs(mondayStr) {
  const m = parseDateStr(mondayStr);
  return Array.from({ length: 7 }, (_, i) => toDateStr(addDays(m, i)));
}
function dateLabel(dateStr) {
  const d = parseDateStr(dateStr);
  return `${d.getMonth() + 1}月${d.getDate()}日`;
}

/* ---------------------------------------------------------
   計分工具
--------------------------------------------------------- */
function emptyChildData() { return { days: {}, bonuses: [], deductions: [] }; }

function allTimeTotalForChild(childData, base) {
  let itemScore = 0;
  Object.values(childData.days || {}).forEach((day) => {
    Object.values(day.scores || {}).forEach((grade) => {
      const pt = GRADE_POINTS[grade];
      if (pt !== undefined) itemScore += pt;
    });
  });
  const bonusScore = (childData.bonuses || []).reduce((s, b) => s + Number(b.points || 0), 0);
  const deductionScore = (childData.deductions || []).reduce((s, d) => s + Number(d.points || 0), 0);
  const total = (base || 0) + itemScore + bonusScore - deductionScore;
  return { itemScore, bonusScore, deductionScore, total };
}

function weekTotalForChild(childData, mondayStr) {
  const safeChildData = childData || { days: {}, bonuses: [] };
  const dateStrs = getWeekDateStrs(mondayStr);
  let dailyTotal = 0;
  const itemTotals = {};
  dateStrs.forEach((ds) => {
    const day = childData.days[ds];
    if (!day) return;
    Object.entries(day.scores || {}).forEach(([item, grade]) => {
      const pt = GRADE_POINTS[grade];
      if (pt === undefined) return;
      dailyTotal += pt;
      itemTotals[item] = (itemTotals[item] || 0) + pt;
    });
  });
  const bonusEntries = (childData.bonuses || []).filter((b) => dateStrs.includes(b.date));
  const bonusTotal = bonusEntries.reduce((s, b) => s + Number(b.points || 0), 0);
  return { dailyTotal, itemTotals, bonusTotal, bonusEntries: bonusEntries.sort((a,b)=>b.date.localeCompare(a.date)), grandTotal: dailyTotal + bonusTotal };
}

function itemWeekTotal(childData, mondayStr, item) {
  if (!childData || !childData.days) return 0;
  const dateStrs = getWeekDateStrs(mondayStr);
  let total = 0;
  dateStrs.forEach((ds) => {
    const grade = childData.days[ds]?.scores?.[item];
    const pt = GRADE_POINTS[grade];
    if (pt !== undefined) total += pt;
  });
  return total;
}

/* ---------------------------------------------------------
   簡易 SVG 折線圖 (取代 recharts，純手刻無外部依賴)
--------------------------------------------------------- */
function MiniLineChart({ data, seriesKeys, colors, height = 200 }) {
  const width = 600;
  const padding = { top: 12, right: 14, bottom: 24, left: 8 };
  const values = data.flatMap((d) => seriesKeys.map((k) => Number(d[k]) || 0));
  let minV = Math.min(0, ...values);
  let maxV = Math.max(1, ...values);
  if (minV === maxV) { minV -= 1; maxV += 1; }
  const innerW = width - padding.left - padding.right;
  const innerH = height - padding.top - padding.bottom;
  const xStep = data.length > 1 ? innerW / (data.length - 1) : 0;
  const xScale = (i) => padding.left + i * xStep;
  const yScale = (v) => padding.top + innerH - ((v - minV) / (maxV - minV || 1)) * innerH;
  const showEvery = Math.max(1, Math.ceil(data.length / 6));

  return (
    <svg viewBox={`0 0 ${width} ${height}`} style={{ width: '100%', height, display: 'block' }}>
      {minV < 0 && maxV > 0 && (
        <line x1={padding.left} x2={width - padding.right} y1={yScale(0)} y2={yScale(0)} stroke="#D8D6C9" strokeDasharray="3 3" />
      )}
      {seriesKeys.map((k, si) => {
        const points = data.map((d, i) => `${xScale(i)},${yScale(Number(d[k]) || 0)}`).join(' ');
        return (
          <g key={k}>
            <polyline points={points} fill="none" stroke={colors[si]} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
            {data.map((d, i) => (
              <circle key={i} cx={xScale(i)} cy={yScale(Number(d[k]) || 0)} r="3" fill={colors[si]} />
            ))}
          </g>
        );
      })}
      {data.map((d, i) => (
        (i % showEvery === 0 || i === data.length - 1) && (
          <text key={i} x={xScale(i)} y={height - 6} fontSize="10" textAnchor="middle" fill="#B8B6AA" fontFamily="Space Grotesk, sans-serif">{d.label}</text>
        )
      ))}
    </svg>
  );
}

        <div className="settings-panel">
          <div className="settings-row">
            <span>匯率（1點 = $）</span>
            <input className="input small" type="number" value={exchangeRate} onChange={(e) => onExchangeRateChange(e.target.value)} />
          </div>
          {CHILDREN.map((c) => (
            <div className="settings-row" key={c.id}>
              <span>{c.emoji} {c.name} 起始總分</span>
              <input className="input small" type="number" value={baseScores[c.id]} onChange={(e) => onBaseScoreChange(c.id, e.target.value)} />
            </div>
          ))}
        </div>
      )}

      <div className="section-title">扣點 / 扣錢</div>
      <ChildSwitch activeId={activeChild} onChange={setActiveChild} />

      <div className="mode-toggle" style={{ padding: '12px 0 0' }}>
        <button className={`mode-btn${mode === 'points' ? ' active' : ''}`} onClick={() => setMode('points')}>直接扣點</button>
        <button className={`mode-btn${mode === 'money' ? ' active' : ''}`} onClick={() => setMode('money')}>用金額換算</button>
      </div>

      <div className="bonus-form" style={{ marginTop: 10 }}>
        <input type="date" className="input" value={date} onChange={(e) => setDate(e.target.value)} />
        <input type="number" className="input" placeholder={mode === 'points' ? '扣除點數' : '金額 $'} value={amount} onChange={(e) => setAmount(e.target.value)} />
        {mode === 'money' && amount ? (
          <div className="convert-preview">= 扣 <b>{computedPoints}</b> 點（無條件進位）</div>
        ) : null}
        <input type="text" className="input" placeholder="原因，例如：換零用錢 / 做壞事" value={reason} onChange={(e) => setReason(e.target.value)} />
        {formError && <div className="form-error">{formError}</div>}
        <button className="add-btn deduct-btn" onClick={submit}>＋ 確認扣點</button>
      </div>

      <div className="section-title">扣點紀錄</div>
      {sortedDeductions.length === 0 ? (
        <div className="empty-note">還沒有扣點紀錄</div>
      ) : (
        <div className="bonus-list">
          {sortedDeductions.map((d) => (
            <div className="bonus-row" key={d.id}>
              <div>
                <div className="bonus-reason">{d.reason}</div>
                <div className="bonus-meta">{dateLabel(d.date)}・{d.recordedBy}{d.mode === 'money' ? `・$${d.moneyAmount}` : ''}</div>
              </div>
              <div className="bonus-right">
                <span className="neg big">-{d.points}</span>
                <button className="icon-btn" onClick={() => {
                  if (confirmId === d.id) { onDeleteDeduction(activeChild, d.id); setConfirmId(null); }
                  else setConfirmId(d.id);
                }}>
                  {confirmId === d.id ? <span className="confirm-text">確定?</span> : '🗑'}
                </button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   主程式
--------------------------------------------------------- */
function App() {
  const [loading, setLoading] = useState(true);
  const [data, setData] = useState({ duoduo: emptyChildData(), qiuqiu: emptyChildData() });
  const [overrides, setOverrides] = useState({});
  const [whoAmI, setWhoAmI] = useState('爸爸');
  const [syncStatus, setSyncStatus] = useState('connecting');

  const [activeTab, setActiveTab] = useState('daily');
  const [dailyMode, setDailyMode] = useState('single');
  const [activeChild, setActiveChild] = useState('duoduo');
  const [selectedDate, setSelectedDate] = useState(toDateStr(new Date()));
  const [weekMonday, setWeekMonday] = useState(toDateStr(getMonday(new Date())));
  const [baseScores, setBaseScores] = useState({ duoduo: 0, qiuqiu: 0 });
  const [exchangeRate, setExchangeRate] = useState(5);

  const fetchAll = async (isInitial) => {
    const [dd, qq, ov, base, rate] = await Promise.all([
      dbGet('records-duoduo', emptyChildData()),
      dbGet('records-qiuqiu', emptyChildData()),
      dbGet('daytype-overrides', {}),
      dbGet('settings-base-score', { duoduo: 0, qiuqiu: 0 }),
      dbGet('settings-exchange-rate', 5),
    ]);
    const anyError = [dd, qq, ov, base, rate].some((r) => r && r.__error);
    setSyncStatus(anyError ? 'error' : 'ok');
    setData({
      duoduo: { ...emptyChildData(), ...(dd && dd.__error ? dd.fallback : dd) },
      qiuqiu: { ...emptyChildData(), ...(qq && qq.__error ? qq.fallback : qq) },
    });
    setOverrides(ov && ov.__error ? ov.fallback : ov);
    setBaseScores(base && base.__error ? base.fallback : base);
    setExchangeRate(rate && rate.__error ? rate.fallback : rate);
    if (isInitial) setLoading(false);
  };

  useEffect(() => {
    fetchAll(true);
    const interval = setInterval(() => fetchAll(false), 15000);
    const onVisible = () => { if (document.visibilityState === 'visible') fetchAll(false); };
    document.addEventListener('visibilitychange', onVisible);
    window.addEventListener('focus', onVisible);
    return () => {
      clearInterval(interval);
      document.removeEventListener('visibilitychange', onVisible);
      window.removeEventListener('focus', onVisible);
    };
  }, []);

  const persistChild = async (childId, newChildData) => {
    const ok = await dbSet(STORAGE_KEYS[childId], newChildData);
    setSyncStatus(ok ? 'ok' : 'error');
  };
  const persistOverrides = async (next) => {
    const ok = await dbSet('daytype-overrides', next);
    setSyncStatus(ok ? 'ok' : 'error');
  };
  const persistBaseScores = async (next) => {
    const ok = await dbSet('settings-base-score', next);
    setSyncStatus(ok ? 'ok' : 'error');
  };
  const persistExchangeRate = async (v) => {
    const ok = await dbSet('settings-exchange-rate', v);
    setSyncStatus(ok ? 'ok' : 'error');
  };

  const handleBaseScoreChange = (childId, value) => {
    setBaseScores((prev) => {
      const next = { ...prev, [childId]: value === '' ? 0 : Number(value) };
      persistBaseScores(next);
      return next;
    });
  };
  const handleExchangeRateChange = (value) => {
    const v = value === '' ? 0 : Number(value);
    setExchangeRate(v);
    persistExchangeRate(v);
  };

  const handleAddDeduction = (childId, entry) => {
    setData((prev) => {
      const childData = prev[childId];
      const newDeduction = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ...entry, recordedBy: whoAmI };
      const newChildData = { ...childData, deductions: [newDeduction, ...(childData.deductions || [])] };
      persistChild(childId, newChildData);
      return { ...prev, [childId]: newChildData };
    });
  };
  const handleDeleteDeduction = (childId, id) => {
    setData((prev) => {
      const childData = prev[childId];
      const newChildData = { ...childData, deductions: (childData.deductions || []).filter((d) => d.id !== id) };
      persistChild(childId, newChildData);
      return { ...prev, [childId]: newChildData };
    });
  };

  const handleScoreChange = (childId, dateStr, item, grade) => {
    setData((prev) => {
      const childData = prev[childId];
      const existingDay = childData.days[dateStr] || { scores: {}, recordedBy: whoAmI };
      const newScores = { ...existingDay.scores };
      if (grade) newScores[item] = grade; else delete newScores[item];
      const newDay = { scores: newScores, recordedBy: whoAmI };
      const newChildData = { ...childData, days: { ...childData.days, [dateStr]: newDay } };
      persistChild(childId, newChildData);
      return { ...prev, [childId]: newChildData };
    });
  };

  const handleOverride = (dateStr, val) => {
    setOverrides((prev) => {
      const next = { ...prev };
      if (val === 'auto') delete next[dateStr]; else next[dateStr] = val;
      persistOverrides(next);
      return next;
    });
  };

  const handleAddBonus = (childId, entry) => {
    setData((prev) => {
      const childData = prev[childId];
      const newBonus = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ...entry, recordedBy: whoAmI };
      const newChildData = { ...childData, bonuses: [newBonus, ...childData.bonuses] };
      persistChild(childId, newChildData);
      return { ...prev, [childId]: newChildData };
    });
  };
  const handleDeleteBonus = (childId, id) => {
    setData((prev) => {
      const childData = prev[childId];
      const newChildData = { ...childData, bonuses: childData.bonuses.filter((b) => b.id !== id) };
      persistChild(childId, newChildData);
      return { ...prev, [childId]: newChildData };
    });
  };

  const handleWhoAmI = (v) => { setWhoAmI(v); };

  const activeChildMeta = CHILDREN.find((c) => c.id === activeChild);

  return (
    <div className="app-root">
      {loading ? (
        <div className="loading-screen">載入中...</div>
      ) : (
        <>
          <div className="header">
            <div className="header-title"><span className="b">多多</span> ＆ <span className="r">球球</span> 記分本</div>
            <div className="header-right">
              <div className={`sync-dot ${syncStatus}`} title={syncStatus === 'ok' ? '雲端同步正常' : syncStatus === 'error' ? '無法連線雲端資料庫' : '連線中...'} />
              <div className="whoami">
                {['爸爸', '媽媽'].map((w) => (
                  <button key={w} className={whoAmI === w ? 'active' : ''} onClick={() => handleWhoAmI(w)}>{w}</button>
                ))}
              </div>
            </div>
          </div>
          {syncStatus === 'error' && (
            <div className="sync-error-banner">⚠️ 無法連線到雲端資料庫，資料可能沒有同步，請檢查 Firebase 網址與規則設定</div>
          )}

          {activeTab === 'daily' && (
            <>
              <ChildSwitch activeId={activeChild} onChange={setActiveChild} />
              <div className="mode-toggle">
                <button className={`mode-btn${dailyMode === 'single' ? ' active' : ''}`} onClick={() => setDailyMode('single')}>單日紀錄</button>
                <button className={`mode-btn${dailyMode === 'week' ? ' active' : ''}`} onClick={() => setDailyMode('week')}>整週補登</button>
              </div>
              <div
                className={`child-theme ${activeChild}`}
                style={{ '--accent': activeChildMeta.color, '--accent-soft': activeChildMeta.soft, '--accent-dark': activeChildMeta.dark }}
              >
                {dailyMode === 'single' ? (
                  <DailyRecordView
                    childId={activeChild}
                    childData={data[activeChild]}
                    overrides={overrides}
                    whoAmI={whoAmI}
                    onScoreChange={handleScoreChange}
                    onOverride={handleOverride}
                    selectedDate={selectedDate}
                    setSelectedDate={setSelectedDate}
                  />
                ) : (
                  <WeekCatchUpView
                    childId={activeChild}
                    childData={data[activeChild]}
                    overrides={overrides}
                    onScoreChange={handleScoreChange}
                    weekMonday={weekMonday}
                    setWeekMonday={setWeekMonday}
                  />
                )}
              </div>
            </>
          )}

          {activeTab === 'summary' && (
            <SummaryView data={data} overrides={overrides} weekMonday={weekMonday} setWeekMonday={setWeekMonday} />
          )}

          {activeTab === 'bonus' && (
            <>
              <ChildSwitch activeId={activeChild} onChange={setActiveChild} />
              <div
                className={`child-theme ${activeChild}`}
                style={{ '--accent': activeChildMeta.color, '--accent-soft': activeChildMeta.soft, '--accent-dark': activeChildMeta.dark }}
              >
                <BonusView
                  childId={activeChild}
                  childData={data[activeChild]}
                  whoAmI={whoAmI}
                  onAdd={handleAddBonus}
                  onDelete={handleDeleteBonus}
                />
              </div>
            </>
          )}

          {activeTab === 'total' && (
            <TotalView
              data={data}
              baseScores={baseScores}
              exchangeRate={exchangeRate}
              onBaseScoreChange={handleBaseScoreChange}
              onExchangeRateChange={handleExchangeRateChange}
              activeChild={activeChild}
              setActiveChild={setActiveChild}
              onAddDeduction={handleAddDeduction}
              onDeleteDeduction={handleDeleteDeduction}
            />
          )}

          <div className="bottom-nav">
            <button className={`nav-btn${activeTab === 'daily' ? ' active' : ''}`} onClick={() => setActiveTab('daily')}>
              <span className="nav-glyph">📅</span><span className="label">紀錄</span>
            </button>
            <button className={`nav-btn${activeTab === 'summary' ? ' active' : ''}`} onClick={() => setActiveTab('summary')}>
              <span className="nav-glyph">📊</span><span className="label">週統整</span>
            </button>
            <button className={`nav-btn${activeTab === 'bonus' ? ' active' : ''}`} onClick={() => setActiveTab('bonus')}>
              <span className="nav-glyph">✍</span><span className="label">加減分</span>
            </button>
            <button className={`nav-btn${activeTab === 'total' ? ' active' : ''}`} onClick={() => setActiveTab('total')}>
              <span className="nav-glyph">🥇</span><span className="label">總分</span>
            </button>
          </div>
        </>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
